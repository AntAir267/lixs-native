name: Bug report
description: Something looks or works wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please never attach game files or extracted game data. Screenshots and logs are welcome.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Which part of the game (menu, stunt, area of the island) and what you were doing.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Paste ~/.local/share/lixs-native/options.txt if you changed anything.
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Distribution, GPU and driver.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach ~/.local/share/lixs-native/last-run.log, above all after a crash.
